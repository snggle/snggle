name: snggle
description: Private keys manager
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 0.0.77

environment:
  sdk: "3.12.2"
  flutter: "3.44.7"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # AutoRoute is a declarative routing solution, where everything needed for navigation is automatically generated
  # https://pub.dev/packages/auto_route
  auto_route: 11.1.0

  # A Dart package that helps to implement value based equality without needing to explicitly override == and hashCode
  # https://pub.dev/packages/equatable
  equatable: 2.0.5

  # Flutter Widgets that make it easy to implement the BLoC (Business Logic Component) design pattern
  # https://pub.dev/packages/flutter_bloc
  flutter_bloc: 9.1.1

  # Accessing Service Objects/View/AppModels/Managers/BLoCs from Flutter Views
  # https://pub.dev/packages/get_it
  get_it: 7.6.7

  # Contains code to deal with internationalized/localized messages, date and number formatting and parsing,
  # bidirectional text, and other internationalization issues.
  # https://pub.dev/packages/intl
  intl: 0.20.2

  # Small, easy to use and extensible logger which prints beautiful logs.
  # https://pub.dev/packages/logger
  logger: 2.4.0

  # Flutter Secure Storage provides API to store data in secure storage.
  # Keychain is used in iOS, KeyStore based solution is used in Android.
  # https://pub.dev/packages/flutter_secure_storage
  flutter_secure_storage: 10.3.1

  # RFC4122 (v1, v4, v5) UUID Generator and Parser for all Dart platforms (Web, VM, Flutter)
  # https://pub.dev/packages/uuid
  uuid: 4.5.3

  # An SVG rendering and widget library for Flutter, which allows painting and displaying Scalable Vector Graphics 1.1 files.
  # https://pub.dev/packages/flutter_svg
  flutter_svg: 2.0.10+1

  # Etherum Blockies implementation
  # https://pub.dev/packages/blockies_svg
  blockies_svg: 1.0.2

  # Flutter plugin for getting commonly used locations on host platform file systems, such as the temp and app data directories.
  # https://pub.dev/packages/path_provider
  path_provider: 2.1.5

  # Spring curves for Flutter animations. Based on real physics equations with three damping curves.
  # https://pub.dev/packages/sprung
  sprung: 3.0.1

  # Gradient borders for inputs and containers. Borders package integrated with a basic flutter widgets as a container and input decorations. Easy in use, platform independent.
  # https://pub.dev/packages/gradient_borders
  gradient_borders: 1.0.1

  # Wrap a widget with CustomPopupMenu, Tap or Long Press this widget, a popup menu would display in a suitable position.
  # https://pub.dev/packages/custom_pop_up_menu
  custom_pop_up_menu: 1.2.4

  # Flutter database for Dart-native objects and on-device vector management
  # https://pub.dev/packages/objectbox
  objectbox: 5.3.2

  # ObjectBox Core binaries for the ObjectBox Database. Needs to be included for Flutter apps.
  # https://pub.dev/packages/objectbox_flutter_libs
  objectbox_flutter_libs: 5.3.2

  # This plugin provides a cross-platform (iOS, Android) API to request permissions and check their status.
  # https://pub.dev/packages/permission_handler
  permission_handler: 11.3.1

  # QR code scanner that can be embedded inside flutter. It uses zxing in Android and MTBBarcode scanner in iOS.
  # https://pub.dev/packages/qr_code_scanner_plus
  qr_code_scanner_plus: 2.2.0

  # QR.Flutter is a Flutter library for simple and fast QR code rendering via a Widget or custom painter.
  # https://pub.dev/packages/qr_flutter
  qr_flutter: 4.1.0

  # The decimal package allows you to deal with decimal numbers without losing precision.
  # https://pub.dev/packages/decimal
  decimal: 2.3.3

  # A set of useful sliver tools that are missing from the flutter framework
  # https://pub.dev/packages/sliver_tools
  sliver_tools: 0.2.12

  # Dart package containing utility methods for data encoding and decoding.
  codec_utils:
    git:
      url: https://github.com/snggle/codec_utils.git
      ref: master

  # Dart package containing utility methods for common cryptographic and blockchain-specific operations.
  cryptography_utils:
    git:
      url: https://github.com/snggle/cryptography_utils.git
      ref: master

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # AutoRoute is a declarative routing solution, where everything needed for navigation is automatically generated
  # https://pub.dev/packages/auto_route_generator
  auto_route_generator: 10.5.0

  # A testing library which makes it easy to test blocs
  # https://pub.dev/packages/bloc_test
  bloc_test: 10.0.0

  # A build system for Dart code generation and modular compilation
  # https://pub.dev/packages/build_runner
  build_runner: 2.15.0

  # Code generator for the ObjectBox Database. Finds classes annotated with @Collection.
  # https://pub.dev/packages/objectbox_generator
  objectbox_generator: 5.3.2

objectbox:
  output_dir: shared/objectbox

dependency_overrides:
  flutter_secure_storage_windows: 4.2.0
  win32: 6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/documents/
    - assets/fonts/
    - assets/fonts/bauhaus/
    - assets/icons/
    - assets/icons_animated/
  fonts:
    - family: Bauhaus
      fonts:
        - asset: assets/fonts/bauhaus/BauhausRegular.ttf
          weight: 400
        - asset: assets/fonts/bauhaus/BauhausMedium.otf
          weight: 500
        - asset: assets/fonts/bauhaus/BauhausDemi.ttf
          weight: 700
        - asset: assets/fonts/bauhaus/BauhausBold.otf
          weight: 800
        - asset: assets/fonts/bauhaus/BauhausHeavy.ttf
          weight: 900

flutter_intl:
  enabled: true
